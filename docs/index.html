<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SkyForce — Thierry Family Edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ===================== PILOT PICKER ===================== -->
  <section id="screen-profiles" class="screen menu-bg active">
    <div class="family-title">THE THIERRY FAMILY PRESENTS</div>
    <h1 class="game-title">SKY<span>FORCE</span></h1>
    <p class="tagline">Who's flying today?</p>
    <div id="profileGrid" class="profile-grid"></div>
    <button id="addProfileBtn" class="ghost-btn">+ Add Pilot</button>
  </section>

  <!-- ===================== MAIN MENU ===================== -->
  <section id="screen-menu" class="screen menu-bg">
    <div class="family-title">THE THIERRY FAMILY PRESENTS</div>
    <h1 class="game-title">SKY<span>FORCE</span></h1>
    <div id="menuPilot" class="menu-pilot"></div>
    <div class="menu-buttons">
      <button id="playBtn" class="main-btn">▶ FLY A MISSION</button>
      <button id="armoryBtn" class="main-btn">🛠 ARMORY</button>
      <button id="achievementsBtn" class="main-btn">🏅 MEDALS</button>
      <button id="leaderboardBtn" class="main-btn">🏆 CHAMPIONSHIP</button>
      <button id="switchBtn" class="ghost-btn">Switch Pilot</button>
    </div>
  </section>

  <!-- ===================== MISSION SELECT ===================== -->
  <section id="screen-missions" class="screen">
    <h2 class="section-title">THE CAMPAIGN</h2>
    <p id="missionStars" class="power-line"></p>
    <!-- The map is drawn on the canvas; one transparent button per stop sits
         over it, so hit-testing, focus and keyboard access come for free. -->
    <div id="missionList" class="campaign-map">
      <canvas id="campaignCanvas" width="640" height="900"></canvas>
      <div id="campaignNodes" class="campaign-nodes"></div>
    </div>
    <div id="campaignHint" class="campaign-hint"></div>
    <button id="missionsBackBtn" class="ghost-btn">Back to Menu</button>
  </section>

  <!-- ===================== BRIEFING (difficulty per mission) ============ -->
  <section id="screen-briefing" class="screen">
    <!-- Hero: the mission's own sky, with the ship you're taking into it. -->
    <div class="brief-hero">
      <canvas id="briefHero" class="brief-hero-art" width="640" height="300"></canvas>
      <div class="brief-hero-fade"></div>
      <div class="brief-hero-text">
        <div class="bh-row">
          <span id="briefNum" class="bh-num"></span>
          <span id="briefBoss" class="bh-boss hidden">☠ BOSS</span>
        </div>
        <h2 id="briefTitle" class="bh-title">MISSION</h2>
        <p id="briefSubtitle" class="bh-sub"></p>
      </div>
    </div>

    <p id="briefText" class="brief-text"></p>

    <div class="brief-cols">
      <div class="brief-block">
        <label class="panel-label">STAR OBJECTIVES</label>
        <div id="briefObjectives" class="brief-objectives"></div>
      </div>
      <div class="brief-block">
        <label class="panel-label">WHAT'S OUT THERE</label>
        <div id="briefRoster" class="brief-roster"></div>
      </div>
    </div>

    <label class="panel-label brief-label">CHOOSE DIFFICULTY</label>
    <div id="briefDifficulties" class="difficulty-list"></div>
    <div id="briefDiffDetail" class="diff-detail"></div>

    <button id="launchBtn" class="main-btn launch-btn">▶ LAUNCH</button>
    <button id="briefBackBtn" class="ghost-btn">Back to Missions</button>
  </section>

  <!-- ===================== ARMORY ===================== -->
  <section id="screen-armory" class="screen">
    <!-- Pinned: the ship stays on screen while you shop, so a part you buy
         appears on the hull without going anywhere. -->
    <div class="armory-top">
      <div class="armory-stage">
        <canvas id="hangarCanvas" class="hangar-canvas" width="620" height="360"></canvas>
        <div id="hangarCompareLabels" class="hangar-labels hidden">
          <span>STOCK</span><span>YOURS</span>
        </div>
        <button id="hangarCompareBtn" class="compare-btn">COMPARE</button>
      </div>
      <div class="armory-bar">
        <div id="hangarNext" class="hangar-next"></div>
        <div id="armoryMoney" class="pc-money"></div>
      </div>
    </div>

    <div id="armoryTabs" class="armory-tabs"></div>
    <div id="armoryPanel" class="armory-panel"></div>

    <!-- Lives in the PILOT tab; kept here so the markup stays static. -->
    <template id="pilotTabTpl">
      <div class="pilot-card">
        <div class="pc-left">
          <div id="pcShip" class="pc-ship"></div>
          <div id="pcRankBadge" class="pc-rank-badge"></div>
        </div>
        <div class="pc-right">
          <div id="pcName" class="pc-name"></div>
          <div id="pcRank" class="pc-rank"></div>
          <div class="pc-bar"><div id="pcBarFill" class="pc-bar-fill"></div></div>
          <div id="pcGear" class="pc-gear"></div>
          <div id="pcLog" class="pc-log"></div>
        </div>
      </div>
      <div class="panel">
        <label class="panel-label">CALLSIGN</label>
        <div class="callsign-row">
          <input id="callsignInput" type="text" maxlength="16">
          <button id="saveCallsignBtn" class="small-btn">SAVE</button>
        </div>
      </div>
      <div class="panel">
        <label class="panel-label">SHIP COLOUR</label>
        <div id="colorRow" class="color-row"></div>
      </div>
      <div class="panel">
        <label class="panel-label">YOUR BADGE</label>
        <div id="badgeRow" class="badge-row"></div>
      </div>
    </template>

    <button id="armoryBackBtn" class="ghost-btn">Back to Menu</button>
  </section>

  <!-- ===================== MEDALS ===================== -->
  <section id="screen-achievements" class="screen">
    <h2 class="section-title">MEDALS</h2>
    <div class="medal-hero">
      <canvas id="medalRing" class="medal-ring" width="150" height="150"></canvas>
      <div class="medal-hero-text">
        <div id="achievementsCount" class="mh-count"></div>
        <div id="medalNext" class="mh-next"></div>
      </div>
    </div>
    <div id="achievementsList" class="medal-grid"></div>
    <button id="achievementsBackBtn" class="ghost-btn">Back to Menu</button>
  </section>

  <!-- ===================== CHAMPIONSHIP ===================== -->
  <section id="screen-leaderboard" class="screen">
    <h2 class="section-title">THE CHAMPIONSHIP</h2>
    <div id="podium" class="podium"></div>
    <div id="leaderboardList" class="leaderboard-list"></div>
    <label class="panel-label brief-label">WHO HOLDS WHAT</label>
    <div id="recordBoard" class="record-board"></div>
    <button id="leaderboardBackBtn" class="ghost-btn">Back to Menu</button>
  </section>

  <!-- ===================== GAME ===================== -->
  <section id="screen-game" class="screen">
    <div class="game-frame">
      <canvas id="game"></canvas>

      <button id="pauseBtn" class="icon-btn top-left">II</button>
      <button id="muteBtn" class="icon-btn top-right">♪</button>

      <div class="ability-bar">
        <button id="overdriveBtn" class="special-btn overdrive hidden">
          <span class="sb-icon">🔥</span><span class="sb-count" id="overdriveCount">0</span>
        </button>
        <button id="bombBtn" class="special-btn hidden">
          <span class="sb-icon">💣</span><span class="sb-count" id="bombCount">0</span>
        </button>
      </div>

      <div id="overlayPause" class="overlay hidden">
        <h2>PAUSED</h2>
        <button id="resumeBtn" class="main-btn">RESUME</button>
        <button id="restartBtn" class="ghost-btn">Restart Mission</button>
        <button id="quitBtn" class="ghost-btn">Quit to Menu</button>
      </div>

      <div id="overlayResults" class="overlay hidden results">
        <h2 id="resultTitle">MISSION COMPLETE</h2>
        <p id="resultSubtitle" class="result-subtitle"></p>
        <div id="resultComms" class="result-comms hidden">
          <canvas id="resultCommsArt" width="72" height="72"></canvas>
          <div><div id="resultCommsWho" class="rc-who"></div><div id="resultCommsText" class="rc-text"></div></div>
        </div>
        <div id="resultStars" class="result-stars"></div>
        <div id="resultObjectives" class="result-objectives"></div>
        <div id="resultLines" class="result-lines"></div>
        <div class="result-buttons">
          <button id="nextBtn" class="main-btn hidden">▶ NEXT MISSION</button>
          <button id="retryBtn" class="main-btn">↻ RETRY</button>
          <button id="resultsMenuBtn" class="ghost-btn">Back to Missions</button>
        </div>
      </div>
    </div>
  </section>

</div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-text">LOADING...</div>
</div>

<!-- Story beats: full-screen comic panels drawn with the pilot's real ship. -->
<div id="storyOverlay" class="story-overlay hidden">
  <div class="story-inner">
    <div id="storyTitle" class="story-title"></div>
    <div id="storyPanels" class="story-panels"></div>
    <button id="storyBtn" class="main-btn">CONTINUE</button>
  </div>
</div>

<div id="achievementToast" class="achievement-toast hidden">
  <div class="at-icon">🏆</div>
  <div>
    <div class="at-label">MEDAL UNLOCKED</div>
    <div id="at-name" class="at-name"></div>
  </div>
</div>

<script src="src/core.js"></script>
<script src="src/audio.js"></script>
<script src="src/data/config.js"></script>
<script src="src/data/enemies.js"></script>
<script src="src/data/missions.js"></script>
<script src="src/data/comms.js"></script>
<script src="src/data/story.js"></script>
<script src="src/profile.js"></script>
<script src="src/fx.js"></script>
<script src="src/input.js"></script>
<script src="src/entities.js"></script>
<script src="src/bosses.js"></script>
<script src="src/systems.js"></script>
<script src="src/render.js"></script>
<script src="src/enemyart.js"></script>
<script src="src/skygen.js"></script>
<script src="src/shipart.js"></script>
<script src="src/comms.js"></script>
<script src="src/game.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
