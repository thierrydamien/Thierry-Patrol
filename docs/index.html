<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyForce — Thierry Family Edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ===================== PROFILE PICKER ===================== -->
  <section id="screen-profiles" class="screen menu-bg active">
    <div class="family-title">THE THIERRY FAMILY PRESENTS</div>
    <p class="tagline">Who's playing?</p>
    <div id="profileGrid" class="profile-grid"></div>
    <button id="addProfileBtn" class="ghost-btn">+ Add Player</button>
  </section>

  <!-- ===================== MAIN MENU ===================== -->
  <section id="screen-menu" class="screen menu-bg">
    <div class="family-title">THE THIERRY FAMILY PRESENTS</div>
    <p id="greeting" class="greeting"></p>
    <div class="menu-buttons">
      <button id="playBtn" class="main-btn">▶ PLAY</button>
      <button id="armoryBtn" class="main-btn">🛠 ARMORY</button>
      <button id="leaderboardBtn" class="main-btn">🏆 CHAMPIONSHIP</button>
      <button id="achievementsBtn" class="main-btn">🏅 ACHIEVEMENTS</button>
      <button id="switchBtn" class="ghost-btn">Switch Player</button>
    </div>
  </section>

  <!-- ===================== DIFFICULTY SELECT ===================== -->
  <section id="screen-difficulty" class="screen">
    <h2 class="section-title">CHOOSE YOUR MISSION</h2>
    <p id="difficultyPower" class="money-line"></p>
    <div id="difficultyList" class="difficulty-list"></div>
    <button id="difficultyBackBtn" class="ghost-btn">Back to Menu</button>
  </section>

  <!-- ===================== ACHIEVEMENTS ===================== -->
  <section id="screen-achievements" class="screen">
    <h2 class="section-title">ACHIEVEMENTS</h2>
    <div id="achievementsList" class="achievements-list"></div>
    <button id="achievementsBackBtn" class="ghost-btn">Back to Menu</button>
  </section>

  <!-- ===================== ARMORY ===================== -->
  <section id="screen-armory" class="screen">
    <h2 class="section-title">ARMORY</h2>
    <p id="armoryMoney" class="money-line"></p>
    <p id="armoryPower" class="power-line"></p>

    <div class="panel">
      <label class="panel-label">CALLSIGN</label>
      <div class="callsign-row">
        <input id="callsignInput" type="text" maxlength="16">
        <button id="saveCallsignBtn" class="small-btn">SAVE</button>
      </div>
    </div>

    <div class="panel">
      <label class="panel-label">SHIP COLOR</label>
      <div id="colorRow" class="color-row"></div>
    </div>

    <div class="panel">
      <label class="panel-label">WEAPONS &amp; GEAR</label>
      <div id="shopItems" class="shop-items"></div>
    </div>

    <button id="armoryBackBtn" class="ghost-btn">Back to Menu</button>
  </section>

  <!-- ===================== LEADERBOARD ===================== -->
  <section id="screen-leaderboard" class="screen">
    <h2 class="section-title">THIERRY FAMILY CHAMPIONSHIP</h2>
    <div id="leaderboardList" class="leaderboard-list"></div>
    <button id="leaderboardBackBtn" class="ghost-btn">Back to Menu</button>
  </section>

  <!-- ===================== GAME ===================== -->
  <section id="screen-game" class="screen">
    <div class="game-frame">
      <canvas id="game"></canvas>

      <button id="pauseBtn" class="icon-btn top-left hidden">II</button>
      <button id="muteBtn" class="icon-btn top-right hidden">♪</button>
      <button id="fireBtn" class="fire-btn hidden">FIRE</button>
      <button id="bombBtn" class="bomb-btn hidden">💣</button>

      <div id="overlayPause" class="overlay hidden">
        <h2>PAUSED</h2>
        <button id="resumeBtn" class="main-btn">RESUME</button>
        <button id="quitBtn" class="ghost-btn">Quit to Menu</button>
      </div>

      <div id="overlayOver" class="overlay hidden">
        <h2>SIGNAL LOST</h2>
        <p id="overScore" class="money-line"></p>
        <p id="overMoney" class="money-line"></p>
        <button id="retryBtn" class="main-btn">▶ RETRY</button>
        <button id="changeDiffBtn" class="ghost-btn">Change Difficulty</button>
        <button id="menuBtn" class="ghost-btn">Back to Menu</button>
      </div>
    </div>
  </section>

</div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-text">LOADING...</div>
</div>

<div id="achievementToast" class="achievement-toast hidden">
  <div class="at-icon">🏆</div>
  <div>
    <div class="at-label">ACHIEVEMENT UNLOCKED</div>
    <div id="at-name" class="at-name"></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
